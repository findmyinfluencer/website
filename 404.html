<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Profile — Find My Influencer</title>
  <meta name="description" content="Public creator profile on Find My Influencer — social reach, audience insights and contact details.">
  <meta name="robots" content="noindex, follow">

  <!-- GitHub Pages has no .htaccess/mod_rewrite — this file is its one
       equivalent mechanism: it serves 404.html's content (status 404, but
       the address bar keeps the original URL) for ANY unmatched path across
       the whole site. Profile URLs are now bare single-segment paths —
       /<slug>/ in production, or /website/<slug>/ in local testing (this
       repo's root sits one level under MAMP's docroot, same known local
       prefix used by the ErrorDocument directive in website/.htaccess) —
       so path depth is what tells a profile request apart from anything
       else. The profile template's own files (css/js/images) still live
       under p/ — that folder didn't move, only the public URL dropped the
       "/p/" segment, so the computed base points into p/ either way.

       1. A profile-shaped path renders byte-for-byte the same page as
          p/index.html — same app.js (which already shows a sensible
          "couldn't find that creator" message if the slug doesn't resolve).
          Keep this in sync with p/index.html if that page changes.
       2. Anything else (a genuinely dead/unrelated link) shows a plain
          "not found" message instead. -->
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var isProfilePath = parts.length === 1 || (parts.length === 2 && parts[0] === "website");

      if (!isProfilePath) {
        // document.write only INSERTS content — it can't stop the parser
        // from continuing into the profile markup below in <body>. So
        // instead: flag <html> and let CSS hide the profile template and
        // show #fmi-404 in its place (see that block, near the top of body).
        document.documentElement.setAttribute('data-fmi-404', '');
        document.write(
          '<style>' +
          'body{font-family:system-ui,-apple-system,sans-serif;}' +
          '[data-fmi-404] body > *:not(#fmi-404){display:none !important;}' +
          '[data-fmi-404] #fmi-404{display:block !important;text-align:center;padding:80px 20px;color:#1a1a2e;}' +
          '#fmi-404 h1{font-size:28px;margin-bottom:8px;}' +
          '#fmi-404 p{color:#666;margin-bottom:24px;}' +
          '#fmi-404 a{color:#5b4fff;font-weight:600;text-decoration:none;}' +
          '</style>'
        );
        return;
      }

      // The root is everything except the last segment (the slug); p/'s
      // own assets live one level under that root.
      var root = parts.slice(0, -1);
      var base = "/" + root.join("/") + (root.length ? "/" : "") + "p/";
      window.__fmiBase = base;
      document.write(
        '<base href="' + base + '">' +
        '<link rel="icon" type="image/png" href="' + base + '../images/favicon.png">' +
        '<link rel="stylesheet" href="' + base + 'css/style.css">' +
        '<link rel="preconnect" href="https://fonts.googleapis.com">' +
        '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
        '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">' +
        '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">'
      );
    })();
  </script>
</head>
<body>
  <div id="fmi-404" style="display:none;">
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">Go to homepage</a>
  </div>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="../index.html" class="brand" aria-label="findmyinfluencer home">
        <img alt="findmyinfluencer logo">
        <script>if (window.__fmiBase) document.currentScript.previousElementSibling.src = window.__fmiBase + "../images/logo-dark.png";</script>
      </a>
      <div class="header-actions">
        <a href="../signup.html" class="btn btn-primary btn-sm">Join for Free</a>
      </div>
    </div>
  </header>

  <main id="main-content" data-creator-source="data/aditi-kapoor.json">

    <!-- Loading state: replaced once the API response renders -->
    <div class="loading-state" data-creator-loading>Loading creator profile…</div>

    <!-- Hero: dotted banner sized to its content -->
    <section class="hero" data-creator-section="profile" style="display: none;">
      <div class="wrap hero-content">
        <div class="avatar-ring" data-avatar>
          <span class="avatar-circle" data-field="avatar-initials"></span>
        </div>

        <div class="hero-text">
          <div class="hero-name-row">
            <h1 data-field="name"></h1>
            <span class="verified-badge" data-field="status-badge"><i class="fa-solid fa-award" aria-hidden="true"></i> <span data-field="status-text"></span></span>
          </div>
          <p class="hero-bio" data-field="bio"></p>
          <div class="hero-facts" data-field="meta-chips"></div>
        </div>
      </div>
    </section>

    <div class="wrap">
      <div class="profile-stack">
        <aside class="panel" data-creator-section="contact" style="display: none;">
          <div class="panel-head">
            <span class="eyebrow">Reach Out</span>
            <h2>Contact Details</h2>
          </div>
          <div class="contact-list" data-field="contact"></div>
        </aside>

        <section class="platform-section" data-creator-section="platforms" style="display: none;">
          <div class="platform-cards" data-field="platforms"></div>
        </section>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <div class="wrap footer-bottom">
      <span data-field="copyright">© 2026 findmyinfluencer. All rights reserved.</span>
    </div>
  </footer>

  <script>
    (function () {
      if (!window.__fmiBase) return;
      // No dependency on website/js/main.js or website/css — same as
      // p/index.html, which this page must stay in sync with.
      var script = document.createElement('script');
      script.src = window.__fmiBase + 'js/app.js';
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
